<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Page Not Found | HDDHealth Monitor</title>
  <meta name="robots" content="noindex, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="404 — Page Not Found | HDDHealth Monitor">
  <meta property="og:url" content="https://arisohandriputra.github.io/HDD-Health-Monitor/">

  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #fafbfc;
      --surface:   #ffffff;
      --text:      #1e293b;
      --text-soft: #64748b;
      --accent:    #2563eb;
      --border:    #e2e8f0;
      --radius:    10px;
      --max-w:     680px;
      --font:      'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color .15s ease;
    }
    a:hover { color: #1d4ed8; }

    img { max-width: 100%; height: auto; display: block; }

    .page {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      text-align: center;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 2.5rem;
    }

    .logo-wrap img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }

    .logo-wrap span {
      font-size: .9rem;
      font-weight: 600;
      color: var(--text);
    }

    .error-code {
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: -.04em;
      color: var(--accent);
      line-height: 1;
      margin-bottom: .5rem;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: .5rem;
    }

    p {
      font-size: .9rem;
      color: var(--text-soft);
      max-width: 380px;
      margin: 0 auto 2rem;
    }

    .actions {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .85rem;
      font-weight: 500;
      padding: .55rem 1.1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all .15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
    }
    .btn-ghost:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
      color: var(--text);
    }

    .btn svg { width: 16px; height: 16px; fill: currentColor; }

    @media (max-width: 400px) {
      .error-code { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- Logo back to home -->
    <a href="./" class="logo-wrap" aria-label="Back to homepage">
      <img src="logo.png" alt="" width="36" height="36">
      <span>HDDHealth Monitor</span>
    </a>

    <!-- 404 content -->
    <div class="error-code" aria-hidden="true">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

    <div class="actions">
      <a class="btn btn-primary" href="./" aria-label="Go to homepage">
        <svg viewBox="0 0 16 16"><path d="M8.78 1.22a.75.75 0 0 0-1.06 0L2.97 5.97a.75.75 0 0 0 1.06 1.06L7.25 3.81V14.25a.75.75 0 0 0 1.5 0V3.81l3.22 3.22a.75.75 0 1 0 1.06-1.06L8.78 1.22Z"/></svg>
        Back to Home
      </a>
      <a class="btn btn-ghost" href="https://github.com/arisohandriputra/HDD-Health-Monitor" aria-label="View on GitHub">
        <svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 8 0z"/></svg>
        GitHub
      </a>
    </div>

  </main>
</body>
</html>
